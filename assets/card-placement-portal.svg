<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-label="Placement Portal: The hackathon and internship portal my class of 63 has relied on every day for 3 months. Race-safe first-come team slots in DB txns.">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1828"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
  <clipPath id="clip"><rect width="600" height="290" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="600" height="290" fill="url(#bg)"/>
  <circle cx="560" cy="-10" r="130" fill="#A3E635" opacity=".22" filter="url(#blur)"/>
  <rect x="0" y="0" width="600" height="3" fill="url(#bar)"/>
</g>
<rect x=".5" y=".5" width="599" height="289" rx="20" fill="none" stroke="#1C2A43"/>
<text class="mono" x="570" y="92" font-size="84" font-weight="700" text-anchor="end" fill="#A3E635" fill-opacity=".13">03</text>
<text class="mono" x="32" y="52" font-size="13" font-weight="700" letter-spacing="2" fill="#A3E635">IN PRODUCTION · 3 MONTHS</text>
<text class="sans" x="31" y="98" font-size="33" font-weight="700" fill="#EAF0FB">Placement Portal</text>
<text class="sans" x="32" y="140" font-size="17.5" fill="#93A4C2">The hackathon and internship portal my class</text>
<text class="sans" x="32" y="166" font-size="17.5" fill="#93A4C2">of 63 has relied on every day for 3 months.</text>
<text class="sans" x="32" y="192" font-size="17.5" fill="#93A4C2">Race-safe first-come team slots in DB txns.</text>
  <rect x="32" y="224" width="108" height="32" rx="16" fill="#05070F" fill-opacity=".5" stroke="#28395a"/>
  <text class="mono" x="86" y="245" font-size="13" text-anchor="middle" fill="#EAF0FB">Next.js 14</text>
  <rect x="148" y="224" width="75.2" height="32" rx="16" fill="#05070F" fill-opacity=".5" stroke="#28395a"/>
  <text class="mono" x="185.6" y="245" font-size="13" text-anchor="middle" fill="#EAF0FB">Prisma</text>
  <rect x="231.2" y="224" width="108" height="32" rx="16" fill="#05070F" fill-opacity=".5" stroke="#28395a"/>
  <text class="mono" x="285.2" y="245" font-size="13" text-anchor="middle" fill="#EAF0FB">PostgreSQL</text>
  <rect x="347.2" y="224" width="91.6" height="32" rx="16" fill="#05070F" fill-opacity=".5" stroke="#28395a"/>
  <text class="mono" x="393" y="245" font-size="13" text-anchor="middle" fill="#EAF0FB">Tailwind</text>
<text class="mono" x="568" y="245" font-size="14.5" font-weight="700" text-anchor="end" fill="#A3E635">In use →</text>
</svg>
