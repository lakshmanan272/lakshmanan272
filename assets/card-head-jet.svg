<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-label="Head Jet: An arcade jet game you fly with your face. Move your head to steer, open your mouth to fire a NOVA BURST. Runs in the browser.">
<style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1828"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A6BFF"/><stop offset="1" stop-color="#9A6BFF" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
  <clipPath id="clip"><rect width="600" height="290" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="600" height="290" fill="url(#bg)"/>
  <circle cx="560" cy="-10" r="130" fill="#9A6BFF" opacity=".22" filter="url(#blur)"/>
  <rect x="0" y="0" width="600" height="3" fill="url(#bar)"/>
</g>
<rect x=".5" y=".5" width="599" height="289" rx="20" fill="none" stroke="#1C2A43"/>
<text class="mono" x="570" y="92" font-size="84" font-weight="700" text-anchor="end" fill="#9A6BFF" fill-opacity=".13">06</text>
<text class="mono" x="32" y="52" font-size="13" font-weight="700" letter-spacing="2" fill="#9A6BFF">FACE CONTROL · MEDIAPIPE</text>
<text class="sans" x="31" y="98" font-size="33" font-weight="700" fill="#EAF0FB">Head Jet</text>
<text class="sans" x="32" y="140" font-size="17.5" fill="#93A4C2">An arcade jet game you fly with your face.</text>
<text class="sans" x="32" y="166" font-size="17.5" fill="#93A4C2">Move your head to steer, open your mouth</text>
<text class="sans" x="32" y="192" font-size="17.5" fill="#93A4C2">to fire a NOVA BURST. Runs in the browser.</text>
  <rect x="32" y="224" width="99.8" height="32" rx="16" fill="#05070F" fill-opacity=".5" stroke="#28395a"/>
  <text class="mono" x="81.9" y="245" font-size="13" text-anchor="middle" fill="#EAF0FB">MediaPipe</text>
  <rect x="139.8" y="224" width="140.8" height="32" rx="16" fill="#05070F" fill-opacity=".5" stroke="#28395a"/>
  <text class="mono" x="210.2" y="245" font-size="13" text-anchor="middle" fill="#EAF0FB">Face landmarks</text>
  <rect x="288.6" y="224" width="75.2" height="32" rx="16" fill="#05070F" fill-opacity=".5" stroke="#28395a"/>
  <text class="mono" x="326.2" y="245" font-size="13" text-anchor="middle" fill="#EAF0FB">Canvas</text>
<text class="mono" x="568" y="245" font-size="14.5" font-weight="700" text-anchor="end" fill="#9A6BFF">Play it →</text>
</svg>
